<section class="registration-form">
  <header class="form-toolbar">
    <div>
      <h2>Реєстраційна карта гостя</h2>
      <p>Перегляд документа у форматі PDF</p>
    </div>

    <div class="form-actions">
      <label for="registration-card-format">Формат завантаження</label>
      <select
        id="registration-card-format"
        [value]="format()"
        (change)="format.set($any($event.target).value)"
      >
        <option value="PDF">PDF</option>
        <option value="DOCX">Word (.docx)</option>
        <option value="XLSX">Excel (.xlsx)</option>
      </select>
      <label class="preview-width-label" for="registration-preview-width">Ширина {{ previewWidth() }}%</label>
      <input
        class="preview-width-input"
        id="registration-preview-width"
        type="range"
        min="40"
        max="100"
        step="5"
        [value]="previewWidth()"
        (input)="previewWidth.set(+$any($event.target).value)"
        aria-label="Ширина прев’ю документа"
      />
      <button type="button" [disabled]="loadingPreview()" (click)="print()">Друкувати</button>
      <button type="button" [disabled]="downloading() || loadingPreview()" (click)="download()">
        {{ downloading() ? 'Завантаження…' : 'Завантажити' }}
      </button>
    </div>
  </header>

  @if (error()) {
    <div class="form-error" role="alert">{{ error() }}</div>
  }

  @if (loadingPreview()) {
    <div class="preview-state">Формування перегляду…</div>
  } @else if (previewUrl(); as imageUrl) {
    <img class="document-preview" [style.width.%]="previewWidth()" [src]="imageUrl" alt="Реєстраційна карта гостя" />
  }
</section>
