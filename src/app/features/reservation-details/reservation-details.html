
<div class="reservation-details-page">

  <nav class="details-tabs" aria-label="Вкладки бронювання">
    <button
      type="button"
      [class.active]="activeTab() === 'reservation'"
      (click)="selectTab('reservation')"
    >
      <mat-icon>event_note</mat-icon>
      <span>Бронювання</span>
    </button>

    <button
      type="button"
      [class.active]="activeTab() === 'accrual'"
      (click)="selectTab('accrual')"
    >
      <mat-icon>payments</mat-icon>
      <span>Нарахування</span>
    </button>

    <button
      type="button"
      [class.active]="activeTab() === 'registration-form'"
      (click)="selectTab('registration-form')"
    >
      <mat-icon>badge</mat-icon>
      <span>Реєстраційна форма</span>
    </button>

    <button
      type="button"
      [class.active]="activeTab() === 'confirmation'"
      (click)="selectTab('confirmation')"
    >
      <mat-icon>mark_email_read</mat-icon>
      <span>Підтвердження</span>
    </button>

    <button
      type="button"
      [class.active]="activeTab() === 'key-cards'"
      (click)="selectTab('key-cards')"
    >
      <mat-icon>key</mat-icon>
      <span>Ключ-картки</span>
    </button>
  </nav>

  <main class="tab-content">
    @switch (activeTab()) {
      @case ('reservation') {
        <app-reservation-tab />
      }

      @case ('accrual') {
        <app-accrual-tab />
      }

      @case ('registration-form') {
        <app-registration-form-tab />
      }

      @case ('confirmation') {
        <app-confirmation-tab />
      }

      @case ('key-cards') {
        <app-key-cards-tab />
      }
    }
  </main>
</div>
