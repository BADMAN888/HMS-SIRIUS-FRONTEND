<div class="layout-container">
  <aside class="sidebar">
    <div class="logo-container" aria-label="HMS Sirius">
      <img
        class="logo-icon"
        src="/Sirius-photo2.png"
        alt="HMS Sirius"
      />
    </div>

    <nav class="nav-menu" aria-label="Головна навігація">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <mat-icon class="nav-icon">
            {{ item.icon }}
          </mat-icon>

          <span class="nav-label">
            {{ item.label }}
          </span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="nav-item logout-button"
        (click)="onLogout()"
      >
        <mat-icon class="nav-icon">logout</mat-icon>
        <span class="nav-label">Log-Out</span>
      </button>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet />
  </main>
</div>
